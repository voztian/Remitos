<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0F0F0F" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Remitos" />
  <title>Remitos</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0F0F0F; color: #E8E8E8; font-family: 'DM Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
    .app { min-height: 100vh; display: flex; flex-direction: column; }
    .header { display: flex; align-items: center; justify-content: space-between; padding: 18px 24px; border-bottom: 1px solid #2A2A2A; background: #0F0F0F; position: sticky; top: 0; z-index: 100; }
    .logo { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 1.3rem; letter-spacing: -0.5px; }
    .logo span { color: #F97316; }
    .tabs { display: flex; gap: 4px; background: #1A1A1A; border: 1px solid #2A2A2A; border-radius: 10px; padding: 4px; }
    .tab { display: flex; align-items: center; gap: 7px; padding: 8px 18px; border-radius: 7px; border: none; cursor: pointer; font-family: 'DM Sans', sans-serif; font-size: 0.85rem; font-weight: 500; color: #999; background: transparent; transition: all .2s; }
    .tab.active { background: #F97316; color: #fff; }
    .tab:hover:not(.active) { color: #E8E8E8; background: #2A2A2A; }
    .main { flex: 1; padding: 28px 24px; max-width: 500px; margin: 0 auto; width: 100%; }
    .section-title { font-family: 'Syne', sans-serif; font-size: 1.4rem; font-weight: 700; margin-bottom: 5px; }
    .section-sub { color: #999; font-size: 0.87rem; margin-bottom: 24px; }
    .upload-zone { border: 2px dashed #2A2A2A; border-radius: 14px; padding: 44px 24px; text-align: center; cursor: pointer; transition: all .25s; background: #1A1A1A; position: relative; overflow: hidden; }
    .upload-zone:hover { border-color: #F97316; background: rgba(249,115,22,.06); }
    .upload-zone input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
    .upload-icon { color: #F97316; margin-bottom: 12px; }
    .upload-title { font-family: 'Syne', sans-serif; font-weight: 600; font-size: 1rem; margin-bottom: 5px; }
    .upload-hint { color: #999; font-size: 0.82rem; }
    .preview-wrap { margin-top: 18px; border-radius: 12px; overflow: hidden; border: 1px solid #2A2A2A; }
    .preview-wrap img { width: 100%; max-height: 300px; object-fit: cover; display: block; }
    .form { display: flex; flex-direction: column; gap: 14px; margin-top: 22px; }
    .field { display: flex; flex-direction: column; gap: 5px; }
    .label { font-size: 0.78rem; font-weight: 500; color: #999; text-transform: uppercase; letter-spacing: .5px; }
    .input { background: #1A1A1A; border: 1px solid #2A2A2A; border-radius: 9px; padding: 12px 14px; color: #E8E8E8; font-family: 'DM Sans', sans-serif; font-size: 0.92rem; outline: none; transition: border-color .2s; width: 100%; }
    .input:focus { border-color: #F97316; }
    .input::placeholder { color: #555; }
    select.input { cursor: pointer; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 13px 22px; border-radius: 10px; border: none; cursor: pointer; font-family: 'Syne', sans-serif; font-weight: 700; font-size: 0.92rem; transition: all .2s; letter-spacing: .3px; }
    .btn-primary { background: #F97316; color: #fff; width: 100%; }
    .btn-primary:hover { background: #e06010; }
    .btn-primary:disabled { opacity: .4; cursor: not-allowed; }
    .btn-ghost { background: #1A1A1A; color: #E8E8E8; border: 1px solid #2A2A2A; }
    .btn-ghost:hover { border-color: #F97316; color: #F97316; }
    .btn-sm { padding: 8px 12px; font-size: 0.8rem; border-radius: 7px; }
    .toast { position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(80px); background: #1e1e1e; border: 1px solid #F97316; border-radius: 10px; padding: 12px 20px; font-size: 0.88rem; display: flex; align-items: center; gap: 10px; z-index: 999; transition: transform .3s ease; box-shadow: 0 8px 32px rgba(0,0,0,.5); white-space: nowrap; }
    .toast.show { transform: translateX(-50%) translateY(0); }
    .search-row { display: flex; gap: 10px; margin-bottom: 14px; }
    .search-wrap { flex: 1; position: relative; }
    .search-wrap .input { padding-left: 40px; }
    .search-ico { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #555; pointer-events: none; }
    .filter-row { display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
    .filter-field { flex: 1; min-width: 150px; display: flex; flex-direction: column; gap: 5px; }
    .chips { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; align-items: center; }
    .chip { font-size: 0.82rem; padding: 4px 10px; border-radius: 5px; color: #F97316; border: 1px solid rgba(249,115,22,.3); background: rgba(249,115,22,.06); }
    .chip-count { font-size: 0.8rem; color: #555; }
    .remitos-grid { display: flex; flex-direction: column; gap: 10px; }
    .remito-card { background: #1A1A1A; border: 1px solid #2A2A2A; border-radius: 12px; padding: 14px 16px; display: flex; align-items: center; gap: 14px; transition: border-color .2s; }
    .remito-card:hover { border-color: #3a3a3a; }
    .remito-thumb { width: 60px; height: 60px; object-fit: cover; border-radius: 8px; flex-shrink: 0; cursor: pointer; }
    .remito-thumb-ph { width: 60px; height: 60px; border-radius: 8px; flex-shrink: 0; background: #2A2A2A; display: flex; align-items: center; justify-content: center; color: #555; }
    .remito-info { flex: 1; min-width: 0; }
    .remito-client { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 0.97rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .remito-meta { display: flex; gap: 6px; margin-top: 5px; flex-wrap: wrap; }
    .tag { font-size: 0.73rem; color: #999; background: #0F0F0F; border: 1px solid #2A2A2A; border-radius: 5px; padding: 2px 7px; }
    .tag.accent { color: #F97316; border-color: rgba(249,115,22,.3); background: rgba(249,115,22,.06); }
    .remito-actions { display: flex; gap: 6px; flex-shrink: 0; }
    .empty { text-align: center; padding: 56px 0; color: #555; }
    .empty-title { font-family: 'Syne', sans-serif; font-size: 1rem; font-weight: 600; margin-top: 12px; margin-bottom: 5px; color: #999; }
    .spinner { display: flex; justify-content: center; padding: 48px 0; }
    .spin { width: 32px; height: 32px; border: 3px solid #2A2A2A; border-top-color: #F97316; border-radius: 50%; animation: spin .7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.88); z-index: 200; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .modal { background: #1A1A1A; border: 1px solid #2A2A2A; border-radius: 16px; max-width: 540px; width: 100%; padding: 22px; position: relative; max-height: 90vh; overflow-y: auto; }
    .modal img { width: 100%; border-radius: 10px; margin-top: 14px; }
    .modal-close { position: absolute; top: 14px; right: 14px; background: #0F0F0F; border: 1px solid #2A2A2A; border-radius: 6px; color: #999; cursor: pointer; padding: 5px 9px; font-size: 1rem; line-height: 1; }
    .modal-close:hover { color: #E8E8E8; }
    .modal-actions { display: flex; gap: 10px; margin-top: 14px; }
    .install-banner { margin: 0 24px 16px; background: #1A1A1A; border: 1px solid rgba(249,115,22,.3); border-radius: 12px; padding: 14px 16px; display: flex; align-items: center; gap: 14px; }
    .install-banner-text { flex: 1; font-size: 0.85rem; color: #ccc; }
    .install-banner-text strong { color: #F97316; font-family: 'Syne', sans-serif; }
    .hidden { display: none !important; }
    @media (max-width: 600px) {
      .header { padding: 14px 16px; }
      .main { padding: 20px 16px; }
      .row { grid-template-columns: 1fr; }
      .tab-label { display: none; }
      .remito-thumb, .remito-thumb-ph { width: 50px; height: 50px; }
    }
  </style>
</head>
<body>
<div class="app">
  <header class="header">
    <div class="logo">REMI<span>TOS</span></div>
    <div class="tabs">
      <button class="tab active" id="tab-chofer" onclick="switchTab('chofer')">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 3h15v13H1zM16 8h4l3 3v5h-7V8zM5.5 19a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3zM18.5 19a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3z"/></svg>
        <span class="tab-label">Chofer</span>
      </button>
      <button class="tab" id="tab-oficina" onclick="switchTab('oficina')">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zM9 22V12h6v10"/></svg>
        <span class="tab-label">Oficina</span>
      </button>
    </div>
  </header>

  <div id="install-banner" class="install-banner hidden">
    <div class="install-banner-text"><strong>Instalá la app</strong><br>Agregala a tu pantalla de inicio.</div>
    <button class="btn btn-ghost btn-sm" onclick="instalarApp()">Instalar</button>
    <button class="btn btn-ghost btn-sm" onclick="document.getElementById('install-banner').classList.add('hidden')" style="padding:8px">✕</button>
  </div>

  <main class="main">
    <div id="view-chofer">
      <p class="section-title">Cargar remito</p>
      <p class="section-sub">Sacá o subí la foto del remito firmado</p>
      <div class="upload-zone">
        <div class="upload-icon"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg></div>
      <div style="display:flex;gap:12px;margin-top:12px;">
  <label style="flex:1;background:#2A2A2A;border:2px solid #3a3a3a;border-radius:12px;padding:20px 12px;text-align:center;cursor:pointer;font-family:'Syne',sans-serif;font-weight:700;font-size:0.9rem;color:#E8E8E8;">
    📷 Cámara
    <input type="file" accept="image/*" capture="environment" onchange="handleFile(this)" style="display:none" />
  </label>
  <label style="flex:1;background:#2A2A2A;border:2px solid #3a3a3a;border-radius:12px;padding:20px 12px;text-align:center;cursor:pointer;font-family:'Syne',sans-serif;font-weight:700;font-size:0.9rem;color:#E8E8E8;">
    🖼️ Galería
    <input type="file" accept="image/*" onchange="handleFile(this)" style="display:none" />
  </label>
</div>
        <div class="upload-hint">La foto se comprime automáticamente</div>
      </div>
      <div class="preview-wrap hidden" id="preview-wrap">
        <img id="preview-img" src="" alt="preview" />
      </div>
      <div class="form">
        <div class="row">
          <div class="field"><label class="label">Cliente *</label><input class="input" id="f-cliente" placeholder="Nombre del cliente" /></div>
          <div class="field"><label class="label">Número de remito</label><input class="input" id="f-numero" placeholder="Ej: 00123" /></div>
        </div>
        <div class="row">
          <div class="field"><label class="label">Chofer</label><input class="input" id="f-chofer" placeholder="Tu nombre" /></div>
          <div class="field"><label class="label">Fecha de entrega</label><input class="input" type="date" id="f-fecha" /></div>
        </div>
        <div class="field"><label class="label">Horario de entrega</label><input class="input" id="f-horario" placeholder="Ej: 09:00 - 11:00" /></div>
        <button class="btn btn-primary" id="btn-guardar" onclick="guardarRemito()">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
          Guardar remito
        </button>
      </div>
    </div>

    <div id="view-oficina" class="hidden">
      <p class="section-title">Gestión de remitos</p>
      <p class="section-sub">Buscá por cliente, número o chofer</p>
      <div class="search-row">
        <div class="search-wrap">
          <span class="search-ico"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 21l-4.35-4.35M17 11A6 6 0 1 1 5 11a6 6 0 0 1 12 0z"/></svg></span>
          <input class="input" id="search-input" placeholder="Buscar cliente, número o chofer..." oninput="filtrarYRender()" />
        </div>
      </div>
      <div class="filter-row">
        <div class="filter-field"><label class="label">Fecha de entrega</label><input class="input" type="date" id="filter-fecha" onchange="filtrarYRender()" /></div>
        <div class="filter-field"><label class="label">Cliente</label><select class="input" id="filter-cliente" onchange="filtrarYRender()"><option value="">Todos los clientes</option></select></div>
        <div style="display:flex;align-items:flex-end;" id="clear-wrap" class="hidden"><button class="btn btn-ghost btn-sm" onclick="limpiarFiltros()">✕ Limpiar</button></div>
      </div>
      <div class="chips hidden" id="chips"></div>
      <div id="oficina-list"><div class="spinner"><div class="spin"></div></div></div>
    </div>
  </main>
</div>

<div class="toast" id="toast"></div>

<div class="overlay hidden" id="modal-overlay" onclick="cerrarModal()">
  <div class="modal" onclick="event.stopPropagation()">
    <button class="modal-close" onclick="cerrarModal()">✕</button>
    <div id="modal-cliente" style="font-family:'Syne',sans-serif;font-weight:700;font-size:1.05rem;"></div>
    <div id="modal-meta" style="font-size:0.8rem;color:#999;margin-top:4px;"></div>
    <img id="modal-img" src="" alt="remito" />
    <div class="modal-actions">
      <button class="btn btn-primary btn-sm" style="flex:1" onclick="downloadModal()">⬇ Descargar</button>
      <button class="btn btn-ghost btn-sm" style="flex:1" onclick="shareModal()">↑ Compartir</button>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
  import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp }
    from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

  const app = initializeApp({
    apiKey: "AIzaSyBsKqQzxn1_zZn6L99z6sUhObw_0E9fbzo",
    authDomain: "remitos-815f6.firebaseapp.com",
    projectId: "remitos-815f6",
    storageBucket: "remitos-815f6.firebasestorage.app",
    messagingSenderId: "207819756001",
    appId: "1:207819756001:web:2b4126368300da300642a0"
  });
  const db = getFirestore(app);

  let remitos = [];
  let currentModalRemito = null;
  let currentImgData = null;
  let deferredPrompt = null;

  window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault(); deferredPrompt = e;
    document.getElementById('install-banner').classList.remove('hidden');
  });
  window.instalarApp = async function() {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    const { outcome } = await deferredPrompt.userChoice;
    deferredPrompt = null;
    document.getElementById('install-banner').classList.add('hidden');
    if (outcome === 'accepted') showToast('✅ App instalada');
  };

  const q = query(collection(db, 'remitos'), orderBy('createdAt', 'desc'));
  onSnapshot(q, snap => {
    remitos = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    filtrarYRender();
  }, err => { console.error(err); showToast('❌ Error de conexión'); });

  window.switchTab = function(tab) {
    document.getElementById('view-chofer').classList.toggle('hidden', tab !== 'chofer');
    document.getElementById('view-oficina').classList.toggle('hidden', tab !== 'oficina');
    document.getElementById('tab-chofer').classList.toggle('active', tab === 'chofer');
    document.getElementById('tab-oficina').classList.toggle('active', tab === 'oficina');
  };

  function comprimirImagen(file) {
    return new Promise(resolve => {
      const reader = new FileReader();
      reader.onload = e => {
        const img = new Image();
        img.onload = () => {
          const MAX = 1200;
          const canvas = document.createElement('canvas');
          let w = img.width, h = img.height;
          if (w > MAX) { h = h * MAX / w; w = MAX; }
          if (h > MAX) { w = w * MAX / h; h = MAX; }
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL('image/jpeg', 0.88));
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    });
  }

  window.handleFile = async function(input) {
    const file = input.files[0];
    if (!file) return;
    currentImgData = await comprimirImagen(file);
    document.getElementById('preview-img').src = currentImgData;
    document.getElementById('preview-wrap').classList.remove('hidden');
  };

  window.guardarRemito = async function() {
    const cliente = document.getElementById('f-cliente').value.trim();
    if (!currentImgData) return showToast('📷 Adjuntá una foto del remito');
    if (!cliente) return showToast('Ingresá el nombre del cliente');
    const btn = document.getElementById('btn-guardar');
    btn.disabled = true;
    btn.innerHTML = 'Guardando...';
    try {
      const ahora = new Date();
      await addDoc(collection(db, 'remitos'), {
        cliente,
        numero: document.getElementById('f-numero').value.trim(),
        chofer: document.getElementById('f-chofer').value.trim(),
        fechaEntrega: document.getElementById('f-fecha').value,
        horario: document.getElementById('f-horario').value.trim(),
        imgData: currentImgData,
        fecha: ahora.toLocaleDateString('es-AR', { day:'2-digit', month:'2-digit', year:'numeric' }),
        hora: ahora.toLocaleTimeString('es-AR', { hour:'2-digit', minute:'2-digit' }),
        createdAt: serverTimestamp(),
      });
      currentImgData = null;
      document.getElementById('preview-wrap').classList.add('hidden');
      document.getElementById('preview-img').src = '';
      document.getElementById('file-input').value = '';
      ['f-cliente','f-numero','f-chofer','f-horario'].forEach(id => document.getElementById(id).value = '');
      document.getElementById('f-fecha').value = '';
      showToast('✅ Remito guardado');
    } catch(e) { console.error(e); showToast('❌ Error al guardar. Revisá la conexión.'); }
    btn.disabled = false;
    btn.innerHTML = '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg> Guardar remito';
  };

  window.filtrarYRender = function() {
    const search = (document.getElementById('search-input')?.value || '').toLowerCase();
    const filterFecha = document.getElementById('filter-fecha')?.value || '';
    const filterCliente = document.getElementById('filter-cliente')?.value || '';
    const clientesUnicos = [...new Set(remitos.map(r => r.cliente))].sort();
    const sel = document.getElementById('filter-cliente');
    if (sel) {
      const prev = sel.value;
      sel.innerHTML = '<option value="">Todos los clientes</option>';
      clientesUnicos.forEach(c => { const o = document.createElement('option'); o.value = c; o.textContent = c; if (c === prev) o.selected = true; sel.appendChild(o); });
    }
    const filtered = remitos.filter(r => {
      if (search && !r.cliente?.toLowerCase().includes(search) && !(r.numero||'').toLowerCase().includes(search) && !(r.chofer||'').toLowerCase().includes(search)) return false;
      if (filterFecha && r.fechaEntrega !== filterFecha) return false;
      if (filterCliente && r.cliente !== filterCliente) return false;
      return true;
    });
    const hasFilter = search || filterFecha || filterCliente;
    document.getElementById('clear-wrap')?.classList.toggle('hidden', !hasFilter);
    const chips = document.getElementById('chips');
    if (chips) {
      if (filterFecha || filterCliente) {
        chips.classList.remove('hidden'); chips.innerHTML = '';
        if (filterFecha) chips.innerHTML += `<span class="chip">📅 ${new Date(filterFecha+'T00:00:00').toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit',year:'numeric'})}</span>`;
        if (filterCliente) chips.innerHTML += `<span class="chip">👤 ${filterCliente}</span>`;
        chips.innerHTML += `<span class="chip-count">${filtered.length} remito${filtered.length!==1?'s':''}</span>`;
      } else chips.classList.add('hidden');
    }
    const list = document.getElementById('oficina-list');
    if (!list) return;
    if (filtered.length === 0) {
      list.innerHTML = `<div class="empty"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#555" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8zM14 2v6h6"/></svg><div class="empty-title">${hasFilter ? 'Sin resultados' : 'Aún no hay remitos'}</div><p style="font-size:.82rem;color:#555">${hasFilter ? 'Probá con otros filtros' : 'Los choferes pueden cargar desde la solapa Chofer'}</p></div>`;
      return;
    }
    list.innerHTML = filtered.map(r => {
      const fechaTag = r.fechaEntrega ? `<span class="tag accent">📅 ${new Date(r.fechaEntrega+'T00:00:00').toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit',year:'numeric'})}</span>` : '';
      const numTag = r.numero ? `<span class="tag">N° ${r.numero}</span>` : '';
      const choferTag = r.chofer ? `<span class="tag">🚛 ${r.chofer}</span>` : '';
      const horarioTag = r.horario ? `<span class="tag">🕐 ${r.horario}</span>` : '';
      const thumb = r.imgData ? `<img class="remito-thumb" src="${r.imgData}" alt="remito" onclick="abrirModal('${r.id}')" loading="lazy" />` : `<div class="remito-thumb-ph"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#555" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8zM14 2v6h6"/></svg></div>`;
      return `<div class="remito-card">${thumb}<div class="remito-info"><div class="remito-client">${r.cliente}</div><div class="remito-meta">${fechaTag}${numTag}<span class="tag">${r.fecha} ${r.hora}</span>${choferTag}${horarioTag}</div></div><div class="remito-actions"><button class="btn btn-ghost btn-sm" onclick="abrirModal('${r.id}')" title="Ver"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button><button class="btn btn-ghost btn-sm" onclick="downloadRemito('${r.id}')" title="Descargar"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg></button><button class="btn btn-ghost btn-sm" onclick="shareRemito('${r.id}')" title="Compartir"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8M16 6l-4-4-4 4M12 2v13"/></svg></button></div></div>`;
    }).join('');
  };

  window.limpiarFiltros = function() {
    document.getElementById('search-input').value = '';
    document.getElementById('filter-fecha').value = '';
    document.getElementById('filter-cliente').value = '';
    filtrarYRender();
  };

  function getRemito(id) { return remitos.find(r => r.id === id); }

  window.downloadRemito = function(id) {
    const r = getRemito(id); if (!r?.imgData) return;
    const a = document.createElement('a');
    a.href = r.imgData;
    a.download = `remito_${r.cliente.replace(/\s+/g,'_')}_${r.fecha.replace(/\//g,'-')}.jpg`;
    a.click(); showToast('⬇️ Descargando...');
  };

  window.shareRemito = function(id) {
    const r = getRemito(id); if (!r) return;
    const text = `📦 Remito\nCliente: ${r.cliente}${r.numero?` (N° ${r.numero})`:''}\nFecha entrega: ${r.fechaEntrega||'-'}${r.horario?`\nHorario: ${r.horario}`:''}${r.chofer?`\nChofer: ${r.chofer}`:''}`;
    if (navigator.share) navigator.share({ text }).catch(()=>{});
    else navigator.clipboard.writeText(text).then(() => showToast('📋 Copiado al portapapeles'));
  };

  window.abrirModal = function(id) {
    const r = getRemito(id); if (!r) return;
    currentModalRemito = r;
    document.getElementById('modal-cliente').textContent = r.cliente;
    document.getElementById('modal-meta').textContent = `${r.fecha} ${r.hora}${r.chofer?' · '+r.chofer:''}${r.fechaEntrega?' · Entrega: '+new Date(r.fechaEntrega+'T00:00:00').toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit',year:'numeric'}):''}`;
    document.getElementById('modal-img').src = r.imgData || '';
    document.getElementById('modal-overlay').classList.remove('hidden');
  };
  window.cerrarModal = function() { document.getElementById('modal-overlay').classList.add('hidden'); currentModalRemito = null; };
  window.downloadModal = function() { if (currentModalRemito) downloadRemito(currentModalRemito.id); };
  window.shareModal = function() { if (currentModalRemito) shareRemito(currentModalRemito.id); };

  let toastTimer;
  window.showToast = function(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
  };
</script>
<script>
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(console.error);
</script>
</body>
</html>
